name: my_skeleton
description: This is skeleton (starter) code for a new Flutter project.
publish_to: "none"
version: 2.0.0

environment:
  sdk: ^3.13.4

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  stack_trace: ^1.12.2
  supabase_flutter: ^2.17.2
  material_ui: ^1.5.0
  shimmer: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  # flutter pub global activate rename
  # rename setAppName --targets ios,android --value "My Skeleton"
  rename: ^3.1.0

flutter_launcher_icons: # dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "dev/images/logo.jpg"
  image_path_android: "dev/images/logo.jpg"
  web:
    generate: true
    image_path: "dev/images/logo.jpg"
  windows:
    generate: true
    image_path: "dev/images/logo.jpg"
  macos:
    generate: true
    image_path: "dev/images/logo_mac.png"

flutter_native_splash: # dart run flutter_native_splash:create
  color: "#f6f6f6"
  image: "dev/images/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
